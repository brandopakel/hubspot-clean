[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hubspot-crm-clean"
version = "0.1.0"
description = "A CLI that audits HubSpot CRM contacts for data hygiene issues and merges the duplicates it finds."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Brando Pakel" }
]

dependencies = [
    "typer>=0.12.0",
    "hubspot-api-client>=8.2.0",
    "rapidfuzz>=3.0.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "responses>=0.25.0",
    "ruff>=0.4.0",
]

[project.scripts]
hubspot-crm-clean = "hubspot_crm_clean.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
