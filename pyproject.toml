[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hubspot-crm-clean"
version = "0.1.0"
description = "A CLI that audits HubSpot CRM contacts for data hygiene issues and merges the duplicates it finds."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Brando Pakel" }
]
keywords = ["hubspot", "crm", "data-quality", "deduplication", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.12.0",
    "hubspot-api-client>=8.2.0",
    "rapidfuzz>=3.0.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

# Must come after every key of [project] above: a sub-table ends the parent
# table, so anything below it would be parsed as part of [project.urls].
[project.urls]
Homepage = "https://github.com/brandopakel/hubspot-clean"
Repository = "https://github.com/brandopakel/hubspot-clean"
Issues = "https://github.com/brandopakel/hubspot-clean/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "responses>=0.25.0",
    "ruff>=0.4.0",
]

[project.scripts]
hubspot-crm-clean = "hubspot_crm_clean.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
# Live tests are deselected by default: everything else in the suite is offline,
# and these are the only tests that write to a real portal. Opt in with
# `pytest -m live` plus the two env vars documented in tests/test_live.py.
addopts = "-m 'not live'"
markers = [
    "live: hits a real HubSpot portal and writes to it (deselected by default)",
]
